<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Guilt Trips</title>
        <link rel="stylesheet" href="assets/css/style.css">
    
</head>
<body>
    <header class="top-header">
        <nav class="nav">
            <div class="nav-logo">
                <h1>Guilt Trips</h1>
            </div>

            <ul class="nav-menu">
                <li class="nav-card"><a href="index.html">Home</a></li>
                
            </ul>
        </nav>
    </header>

    <main>
        <div id="titulo_da_home">
            <h1>Bem-vindo ao Guilt Trips</h1>
        </div>
<section id="breve_apresentacao">
            <p>
            Nós prezamos muito pela sua proxima viagem
            </p>
        </section>
        <footer>
     <form id="lead-form">
  <h2>Receba nossos conteúdos</h2>

  <div>
    <label for="name">Nome:</label>
    <input type="text" id="name" required placeholder="Seu nome completo">
  </div>

  <div>
    <label for="email">E-mail:</label>
    <input type="email" id="email" required placeholder="seu@email.com">
  </div>

  <button type="submit" id="submit-btn">Garantir Vaga</button>
  <p id="message" class="hidden"></p>
</form>
        </footer>
    </main>

        
    <script src="assets/script/script.js"></script>
</body>
</html>
